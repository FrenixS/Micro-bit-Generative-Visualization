<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Micro:bit Algorave Visualizer - Step 2</title>
  
  <!-- Endast p5.js biblioteket behövs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h2>WAND (BATTERY)</h2>
      <ul>
        <li><span>Tilt</span> Move particles</li>
        <li><span>Button A</span> Reset particles</li>
        <li><span>Button B</span> Switch palette</li>
        <li><span>Hold A+B</span> DROP / GLITCH MODE</li>
      </ul>
    </aside>

    <div class="canvas-container" id="canvas-holder"></div>

    <aside class="panel">
      <h2>TRANSMITTER (USB)</h2>
      <ul>
        <li><span>Button A</span> Start show</li>
        <li><span>Button B</span> Stop show</li>
      </ul>
    </aside>
  </div>
</body>
</html>
